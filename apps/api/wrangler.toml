name = "lexi-api"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
CORS_ALLOW_ORIGIN = "http://localhost:5173"
SESSION_TTL_DAYS = "30"
SESSION_COOKIE_SAMESITE = "Lax"
COOKIE_SECURE = "false"
ANON_TTL_DAYS = "30"
VAPID_SUBJECT = "mailto:hello@example.com"
PUSH_ENDPOINT_ALLOWLIST = ""
# Enriched words that pass the quality gate are approved automatically.
# Set to "false" to route every enriched word through the manual review queue.
ENRICHMENT_AUTO_APPROVE = "true"

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lexi_dev"
database_id = "ea59649d-56e5-4e60-87bf-57e435ff2a5f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "c7886c4b50c145598eb24253243466b3"

# =============================================================================
# Production Environment
# =============================================================================
# Deploy with: wrangler deploy --env production
# Set secrets with: wrangler secret put <NAME> --env production

[env.production]
# The live worker kept its pre-rename name. Renaming it would deploy a new
# worker without the old one's secrets or custom domain.
name = "word-of-the-day-api-production"

[env.production.vars]
APP_ENV = "production"
CORS_ALLOW_ORIGIN = "https://lexi.twoplustwoone.dev"
SESSION_TTL_DAYS = "30"
SESSION_COOKIE_SAMESITE = "Lax"
COOKIE_SECURE = "true"
ANON_TTL_DAYS = "30"
VAPID_SUBJECT = "mailto:francisco@twoplustwoone.dev"
NOTIFICATION_SAME_DAY_DELIVERY = "true"
PUSH_ENDPOINT_ALLOWLIST = ""
ENRICHMENT_AUTO_APPROVE = "true"

[env.production.triggers]
crons = ["*/30 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "word_of_the_day"
database_id = "64dfba7a-5c38-4dcb-b111-ebe6f89f4d33"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "09c68a2322be4cab9ef0dc751895ab7f"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
